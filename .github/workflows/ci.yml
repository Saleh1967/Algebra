name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # **وبلا هذا يسقط حارسُ سلسلةِ الأختام كلُّه.**
          # `actions/checkout@v4` يستنسخ بعمقٍ واحدٍ افتراضًا، فيُنشئ
          # `.git/shallow`. وأربعةُ فحوصٍ مشروطةٌ بنفيه: اثنان في
          # `tests/algebra/test_seal_chain.py` واثنان في
          # `tests/algebra/test_message_guard.py` — وهي التي تُثبِت أنّ
          # الختمَ سبقَ التشغيل، **وهي حجّةُ المنهجِ كلِّها**. فكانت
          # تُتخطّى على البوّابةِ التي تحكم الدمجَ وحدَها، بسببٍ مكتوبٍ
          # لا صامتًا — **لكنّها كانت تُتخطّى**. و`0` تعني التاريخَ
          # كلَّه، فيصير الشرطُ كاذبًا وتعمل الأربعة.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -e ".[dev]"
      # **بوّابةٌ واحدةٌ في ملفٍّ واحد**: يُشغَّل `tools/verify.sh` نفسُه
      # الذي يُشغَّل محلّيًّا، بمفسّرِ Runner عبر `PY`. فلا يبقى موضعٌ
      # لخلافٍ بين البوّابتين — كان الخلافُ نطاقَ mypy: ٢٨ ملفًّا هنا
      # مقابل ١٠٧ محلّيًّا، فـ`src/alghanem` و`tools/` خارجَ الفحص.
      #
      # و`pytest` يُشغّل `tests/algebra` و`tests/hawk_dove` و`tests/arabic`،
      # والأخيرةُ تعمل على النقل المغلق في `src/alghanem`. وما لا يعمل منها
      # مُخطًّى بسببٍ مكتوبٍ في `tests/arabic/conftest.py` لا محذوفًا من
      # الجمع. وبصماتُ النقل وأصلُه في `src/alghanem/PORT_MANIFEST.json`.
      - run: PY=python bash tools/verify.sh
