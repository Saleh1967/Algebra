name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -e ".[dev]"
      # يُشغَّل ما يملكه هذا المستودعُ ويستورده فعلًا. و`src/alghanem` إيداعُ
      # نقلٍ لا حزمةٌ تعمل هنا، ومكانُ فحصها نسخةٌ كاملة من Alghanem —
      # انظر `src/alghanem/TRANSFER_NOTICE.md`.
      - run: pytest
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src/algebra src/hawk_dove
