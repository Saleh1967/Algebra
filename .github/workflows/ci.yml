name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -e ".[dev]"
      # `pytest` يُشغّل `tests/algebra` و`tests/hawk_dove` و`tests/arabic`،
      # والأخيرةُ تعمل على النقل المغلق في `src/alghanem` بعد أن صار حزمةً
      # تعمل ههنا (2026-09-24). وما لا يعمل منها مُخطًّى بسببٍ مكتوبٍ في
      # `tests/arabic/conftest.py` لا محذوفًا من الجمع. وبصماتُ النقل
      # وأصلُه في `src/alghanem/PORT_MANIFEST.json`.
      - run: pytest
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src/algebra src/hawk_dove
