[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "alghanem"
version = "0.1.0"
description = "A language-agnostic research kernel for structurally admissible transformations"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy==1.10.0",
    "pytest==8.2.2",
    "ruff==0.6.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
# The generated tree is a derived trace whose canonical rendering is the
# generator's own work. Letting a second formatter rewrite those bytes would
# make regeneration differ from the committed artifact without either the
# generator or the formatter reporting an error, so the drift test — not ruff —
# is the authority over generated bytes.
extend-exclude = ["src/alghanem/realization/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
packages = ["alghanem"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "alghanem.realization.generated.*"
ignore_errors = true
