[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "algebra"
version = "0.1.0"
description = "Standalone algebra: simplicial homology, decision registers, and threshold attainability"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy==1.10.0",
    "pytest==8.2.2",
    "ruff==0.6.9",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["algebra*", "hawk_dove*"]

# `tests/arabic` تختبر وحداتِ إيداعِ النقل في `src/alghanem`، وهي غيرُ قابلة
# للاستيراد في هذا المستودع (انظر `src/alghanem/TRANSFER_NOTICE.md`). ومكانُ
# تشغيلها نسخةٌ كاملةٌ من Saleh1967/Alghanem، لا هنا.
[tool.pytest.ini_options]
testpaths = ["tests/algebra", "tests/hawk_dove"]

[tool.ruff]
line-length = 88
target-version = "py310"
# The generated tree is a derived trace whose canonical rendering is the
# generator's own work. Letting a second formatter rewrite those bytes would
# make regeneration differ from the committed artifact without either the
# generator or the formatter reporting an error, so the drift test — not ruff —
# is the authority over generated bytes.
extend-exclude = ["src/alghanem/realization/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
packages = ["algebra", "hawk_dove"]
mypy_path = "src"

